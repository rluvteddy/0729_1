<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>물멍</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 25%, #eef3f8 0%, #d7e0ea 60%, #c3ced9 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .frame {
    width: min(64vw, 620px);
    height: min(52vh, 380px);
    padding: 14px;
    border-radius: 22px;
    background: linear-gradient(160deg, #6b4a30, #3f2a1a 60%, #2a1b10);
    box-shadow:
      0 20px 40px rgba(0,0,0,0.25),
      inset 0 2px 4px rgba(255,255,255,0.15);
  }

  .tank {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(180deg, #eaf6fb 0%, #dbeef5 100%);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.25);
  }

  .water {
    position: absolute;
    left: 0;
    top: 10%;
    width: 100%;
    height: 90%;
    overflow: hidden;
    background: linear-gradient(180deg, #a9e2f2 0%, #57b3d6 25%, #2482a8 60%, #0f5a76 100%);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
  }
  .water::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0));
  }

  .zone-text {
    position: absolute;
    top: 4%;
    left: 4%;
    font-family: "Malgun Gothic", sans-serif;
    font-weight: 700;
    font-size: 80px;
    line-height: 1;
    color: #111;
    transform-origin: top left;
    animation: dotGrow 10s ease-in-out infinite;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes dotGrow {
    0%   { transform: scale(0.01); }
    50%  { transform: scale(1); }
    100% { transform: scale(0.01); }
  }

  .glass-shine {
    position: absolute;
    top: -20%;
    left: -20%;
    width: 60%;
    height: 140%;
    background: linear-gradient(75deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 55%);
    transform: skewX(-12deg);
    pointer-events: none;
    z-index: 6;
  }

  /* 모래 */
  .sand {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 14%;
    background: linear-gradient(180deg, #f0dda4 0%, #ddbf7c 55%, #c9a55f 100%);
    clip-path: polygon(
      0% 45%, 8% 20%, 18% 40%, 28% 15%, 38% 35%,
      48% 12%, 58% 32%, 68% 14%, 78% 38%, 88% 18%,
      100% 40%, 100% 100%, 0% 100%
    );
  }

  /* 수초 */
  .plant {
    position: absolute;
    bottom: 11%;
    transform-origin: bottom center;
    animation: sway ease-in-out infinite alternate;
  }
  .plant svg { display: block; width: 100%; height: 100%; overflow: visible; }
  @keyframes sway {
    from { transform: rotate(-7deg); }
    to   { transform: rotate(7deg); }
  }
  .p1 { left: 3%;  width: 34px; height: 34%; animation-duration: 3.4s; }
  .p2 { left: 9%;  width: 26px; height: 44%; animation-duration: 4.2s; animation-delay: .3s; }
  .p3 { left: 16%; width: 20px; height: 26%; animation-duration: 3s;   animation-delay: .6s; }
  .p4 { right: 5%; width: 32px; height: 40%; animation-duration: 3.8s; animation-delay: .2s; }
  .p5 { right: 12%;width: 22px; height: 28%; animation-duration: 3.1s; animation-delay: .5s; }
  .p6 { left: 24%; width: 30px; height: 24%; animation-duration: 3.6s; animation-delay: .4s; }

  /* 기포 */
  .bubble {
    position: absolute;
    bottom: 12%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.1));
    animation: rise linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(0) translateX(0); opacity: .8; }
    to   { transform: translateY(-280px) translateX(8px); opacity: 0; }
  }
  .b1 { left: 22%; width: 5px; height: 5px; animation-duration: 6s; animation-delay: 0s; }
  .b2 { left: 47%; width: 8px; height: 8px; animation-duration: 8s; animation-delay: 2s; }
  .b3 { left: 68%; width: 4px; height: 4px; animation-duration: 5s; animation-delay: 3.5s; }
  .b4 { left: 82%; width: 6px; height: 6px; animation-duration: 7s; animation-delay: 1s; }

  /* 물고기 (JS로 위치 제어) */
  .fish-el {
    position: absolute;
    left: 0;
    top: 0;
    cursor: pointer;
    z-index: 3;
  }
  .fish-el svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* 먹이 */
  .food {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8a6a3c, #4d3a1f);
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    transition: top 1.3s cubic-bezier(.3,.6,.7,1);
    z-index: 4;
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="tank">
      <div class="water" id="water">

        <div class="plant p1"><svg viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M10,100 C-4,80 18,66 6,50 C-6,34 16,22 8,0 C20,20 22,36 12,52 C4,66 22,80 10,100 Z" fill="#2f9e59"/></svg></div>
        <div class="plant p2"><svg viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M10,100 C-4,80 18,66 6,50 C-6,34 16,22 8,0 C20,20 22,36 12,52 C4,66 22,80 10,100 Z" fill="#37b56a"/></svg></div>
        <div class="plant p3"><svg viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M10,100 C-4,80 18,66 6,50 C-6,34 16,22 8,0 C20,20 22,36 12,52 C4,66 22,80 10,100 Z" fill="#26824a"/></svg></div>
        <div class="plant p4"><svg viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M10,100 C-4,80 18,66 6,50 C-6,34 16,22 8,0 C20,20 22,36 12,52 C4,66 22,80 10,100 Z" fill="#2f9e59"/></svg></div>
        <div class="plant p5"><svg viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M10,100 C-4,80 18,66 6,50 C-6,34 16,22 8,0 C20,20 22,36 12,52 C4,66 22,80 10,100 Z" fill="#37b56a"/></svg></div>
        <div class="plant p6">
          <svg viewBox="0 0 30 100" preserveAspectRatio="none">
            <path d="M15,100 Q9,62 15,18 Q21,62 15,100 Z" fill="#2e8b57"/>
            <path d="M15,100 Q2,66 6,14 Q15,60 15,100 Z" fill="#3aa568"/>
            <path d="M15,100 Q28,66 24,14 Q15,60 15,100 Z" fill="#256b46"/>
          </svg>
        </div>

        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>

        <div class="zone-text">멍</div>

        <div class="sand"></div>
      </div>
      <div class="glass-shine"></div>
    </div>
  </div>

<script>
(function () {
  var water = document.getElementById('water');

  var fishDefs = [
    { color: '#ff7a2e', w: 56, h: 30, speed: 55, stripe: true },
    { color: '#2f8fe0', w: 48, h: 26, speed: 46, stripe: false },
    { color: '#ffd23f', w: 40, h: 22, speed: 62, stripe: true }
  ];

  function fishSVG(stripe) {
    return '<svg viewBox="0 0 64 32" fill="currentColor" width="100%" height="100%">' +
      '<path d="M18,16 L0,4 L5,16 L0,28 Z"/>' +
      '<path d="M6,16 C6,4 20,-2 38,1 C52,3 62,9 62,16 C62,23 52,29 38,31 C20,34 6,28 6,16 Z"/>' +
      '<circle cx="48" cy="12" r="2.6" fill="#1a1a1a"/>' +
      (stripe ? '<rect x="26" y="2" width="6" height="28" rx="3" fill="#fff" opacity="0.75"/>' : '') +
      '</svg>';
  }

  var fishes = fishDefs.map(function (def, i) {
    var el = document.createElement('div');
    el.className = 'fish-el';
    el.style.width = def.w + 'px';
    el.style.height = def.h + 'px';
    el.style.color = def.color;
    el.innerHTML = fishSVG(def.stripe);
    water.appendChild(el);
    return {
      el: el, w: def.w, h: def.h,
      baseSpeed: def.speed, speed: def.speed,
      x: 20 + i * 70, y: 30 + i * 40,
      tx: 20 + i * 70, ty: 30 + i * 40,
      dir: 1, state: 'idle', stateUntil: 0,
      bobPhase: Math.random() * Math.PI * 2
    };
  });

  function bounds() {
    var r = water.getBoundingClientRect();
    return { w: r.width, h: r.height };
  }

  function randomTarget(f, b) {
    var margin = 8;
    f.tx = margin + Math.random() * Math.max(1, (b.w - f.w - margin * 2));
    f.ty = margin + Math.random() * Math.max(1, (b.h * 0.72 - f.h));
  }

  fishes.forEach(function (f) { randomTarget(f, bounds()); });

  var food = null;
  var foodTimer = null;

  function spawnFood(x, y) {
    if (food) { food.el.remove(); }
    if (foodTimer) { clearTimeout(foodTimer); }

    var b = bounds();
    var size = 7;
    var fx = Math.min(Math.max(x - size / 2, 2), b.w - size - 2);
    var floorY = b.h * 0.74;

    var el = document.createElement('div');
    el.className = 'food';
    el.style.left = fx + 'px';
    el.style.top = Math.min(Math.max(y, 0), floorY) + 'px';
    water.appendChild(el);
    requestAnimationFrame(function () {
      el.style.top = floorY + 'px';
    });

    food = { el: el, x: fx + size / 2, y: floorY };

    fishes.forEach(function (f) { if (f.state !== 'fleeing') f.state = 'toFood'; });

    foodTimer = setTimeout(function () {
      if (food) { food.el.remove(); food = null; }
      fishes.forEach(function (f) { if (f.state === 'toFood') f.state = 'idle'; });
    }, 10000);
  }

  function flee(f, fromX, fromY) {
    var b = bounds();
    var dx = f.x - fromX, dy = f.y - fromY;
    var len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    f.tx = Math.min(Math.max(f.x + dx * 170, 4), b.w - f.w - 4);
    f.ty = Math.min(Math.max(f.y + dy * 110, 4), b.h * 0.78 - f.h);
    f.state = 'fleeing';
    f.stateUntil = performance.now() + 1300;
    f.speed = f.baseSpeed * 2.6;
  }

  water.addEventListener('click', function (e) {
    var r = water.getBoundingClientRect();
    var x = e.clientX - r.left;
    var y = e.clientY - r.top;
    var target = e.target.closest ? e.target.closest('.fish-el') : null;

    if (target) {
      var f = fishes.filter(function (f) { return f.el === target; })[0];
      if (f) flee(f, x, y);
      return;
    }
    spawnFood(x, y);
  });

  var last = performance.now();
  function tick(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    var b = bounds();

    fishes.forEach(function (f, idx) {
      if (f.state === 'fleeing' && now > f.stateUntil) {
        f.state = food ? 'toFood' : 'idle';
        f.speed = f.baseSpeed;
      }
      if (f.state === 'jumping') {
        f.jump.t += dt;
        var jt = Math.min(f.jump.t / f.jump.duration, 1);
        f.x = f.jump.startX + (f.jump.endX - f.jump.startX) * jt;
        f.y = f.jump.startY - Math.sin(Math.PI * jt) * f.jump.height;
        f.dir = f.jump.endX >= f.jump.startX ? 1 : -1;
        if (jt >= 1) {
          f.state = food ? 'toFood' : 'idle';
          f.x = f.jump.endX;
          f.y = f.jump.startY;
          randomTarget(f, b);
        }
        f.el.style.transform = 'translate(' + f.x + 'px,' + f.y + 'px) scaleX(' + f.dir + ')';
        return;
      }

      if (f.state === 'toFood' && food) {
        f.tx = Math.min(Math.max(food.x - f.w / 2 + (idx - 1) * 22, 4), b.w - f.w - 4);
        f.ty = Math.min(Math.max(food.y - f.h / 2, 4), b.h * 0.78 - f.h);
      } else if (f.state === 'idle') {
        var dist0 = Math.hypot(f.tx - f.x, f.ty - f.y);
        if (dist0 < 6) randomTarget(f, b);

        if (Math.random() < dt / 25) {
          var jumpEndX = Math.min(Math.max(f.x + (Math.random() * 80 - 40), 4), b.w - f.w - 4);
          var jumpHeight = Math.min(f.y - 4, b.h * 0.4);
          if (jumpHeight > 12) {
            f.state = 'jumping';
            f.jump = { startX: f.x, startY: f.y, endX: jumpEndX, height: jumpHeight, t: 0, duration: 0.6 };
            return;
          }
        }
      }

      var dx = f.tx - f.x, dy = f.ty - f.y;
      var dist = Math.hypot(dx, dy);
      if (dist > 1) {
        var step = Math.min(f.speed * dt, dist);
        f.x += (dx / dist) * step;
        f.y += (dy / dist) * step;
        if (Math.abs(dx) > 2) f.dir = dx > 0 ? 1 : -1;
      }

      f.bobPhase += dt * 2;
      var bob = Math.sin(f.bobPhase) * 3;
      f.el.style.transform = 'translate(' + f.x + 'px,' + (f.y + bob) + 'px) scaleX(' + f.dir + ')';
    });

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
