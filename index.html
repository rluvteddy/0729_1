<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>물멍</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 25%, #eef3f8 0%, #d7e0ea 60%, #c3ced9 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .frame {
    width: min(64vw, 620px);
    height: min(52vh, 380px);
    padding: 14px;
    border-radius: 22px;
    background: linear-gradient(160deg, #6b4a30, #3f2a1a 60%, #2a1b10);
    box-shadow:
      0 20px 40px rgba(0,0,0,0.25),
      inset 0 2px 4px rgba(255,255,255,0.15);
  }

  .tank {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(180deg, #a9e2f2 0%, #57b3d6 30%, #2482a8 65%, #0f5a76 100%);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.35);
  }

  .glass-shine {
    position: absolute;
    top: -20%;
    left: -20%;
    width: 60%;
    height: 140%;
    background: linear-gradient(75deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 55%);
    transform: skewX(-12deg);
    pointer-events: none;
  }

  /* 모래 */
  .sand {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 14%;
    background: linear-gradient(180deg, #f0dda4 0%, #ddbf7c 55%, #c9a55f 100%);
    clip-path: polygon(
      0% 45%, 8% 20%, 18% 40%, 28% 15%, 38% 35%,
      48% 12%, 58% 32%, 68% 14%, 78% 38%, 88% 18%,
      100% 40%, 100% 100%, 0% 100%
    );
  }

  /* 수초 */
  .plant {
    position: absolute;
    bottom: 11%;
    transform-origin: bottom center;
    animation: sway ease-in-out infinite alternate;
  }
  .plant svg { display: block; width: 100%; height: 100%; overflow: visible; }
  @keyframes sway {
    from { transform: rotate(-7deg); }
    to   { transform: rotate(7deg); }
  }
  .p1 { left: 3%;  width: 34px; height: 34%; animation-duration: 3.4s; }
  .p2 { left: 9%;  width: 26px; height: 44%; animation-duration: 4.2s; animation-delay: .3s; }
  .p3 { left: 16%; width: 20px; height: 26%; animation-duration: 3s;   animation-delay: .6s; }
  .p4 { right: 5%; width: 32px; height: 40%; animation-duration: 3.8s; animation-delay: .2s; }
  .p5 { right: 12%;width: 22px; height: 28%; animation-duration: 3.1s; animation-delay: .5s; }

  /* 기포 */
  .bubble {
    position: absolute;
    bottom: 12%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.1));
    animation: rise linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(0) translateX(0); opacity: .8; }
    to   { transform: translateY(-320px) translateX(8px); opacity: 0; }
  }
  .b1 { left: 22%; width: 5px; height: 5px; animation-duration: 6s; animation-delay: 0s; }
  .b2 { left: 47%; width: 8px; height: 8px; animation-duration: 8s; animation-delay: 2s; }
  .b3 { left: 68%; width: 4px; height: 4px; animation-duration: 5s; animation-delay: 3.5s; }
  .b4 { left: 82%; width: 6px; height: 6px; animation-duration: 7s; animation-delay: 1s; }

  /* 물고기 */
  .fish-wrap {
    position: absolute;
    left: -14%;
    animation-name: swim;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }
  @keyframes swim {
    from { left: -14%; }
    to   { left: 88%; }
  }
  .fish-bob {
    animation-name: bob;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }
  @keyframes bob {
    from { transform: translateY(-6px); }
    to   { transform: translateY(6px); }
  }
  .fish-flip {
    animation-name: flip;
    animation-timing-function: steps(1, end);
    animation-iteration-count: infinite;
  }
  @keyframes flip {
    0%   { transform: scaleX(1); }
    50%  { transform: scaleX(-1); }
    100% { transform: scaleX(1); }
  }
  .fish-flip svg { display: block; }

  .fish1 { top: 26%; }
  .fish1 .fish-flip { width: 56px; height: 30px; color: #ff7a2e; }
  .fish1 .fish-wrap { animation-duration: 8s; }
  .fish1 .fish-flip { animation-duration: 16s; }
  .fish1 .fish-bob  { animation-duration: 2.1s; }

  .fish2 { top: 46%; }
  .fish2 .fish-flip { width: 48px; height: 26px; color: #2f8fe0; }
  .fish2 .fish-wrap { animation-duration: 11s; animation-delay: -3s; }
  .fish2 .fish-flip { animation-duration: 22s; animation-delay: -6s; }
  .fish2 .fish-bob  { animation-duration: 2.6s; }

  .fish3 { top: 62%; }
  .fish3 .fish-flip { width: 40px; height: 22px; color: #ffd23f; }
  .fish3 .fish-wrap { animation-duration: 6.5s; animation-delay: -1s; }
  .fish3 .fish-flip { animation-duration: 13s; animation-delay: -2s; }
  .fish3 .fish-bob  { animation-duration: 1.8s; }
</style>
</head>
<body>

  <div class="frame">
    <div class="tank">

      <div class="plant p1"><svg viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M10,100 C-4,80 18,66 6,50 C-6,34 16,22 8,0 C20,20 22,36 12,52 C4,66 22,80 10,100 Z" fill="#2f9e59"/></svg></div>
      <div class="plant p2"><svg viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M10,100 C-4,80 18,66 6,50 C-6,34 16,22 8,0 C20,20 22,36 12,52 C4,66 22,80 10,100 Z" fill="#37b56a"/></svg></div>
      <div class="plant p3"><svg viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M10,100 C-4,80 18,66 6,50 C-6,34 16,22 8,0 C20,20 22,36 12,52 C4,66 22,80 10,100 Z" fill="#26824a"/></svg></div>
      <div class="plant p4"><svg viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M10,100 C-4,80 18,66 6,50 C-6,34 16,22 8,0 C20,20 22,36 12,52 C4,66 22,80 10,100 Z" fill="#2f9e59"/></svg></div>
      <div class="plant p5"><svg viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M10,100 C-4,80 18,66 6,50 C-6,34 16,22 8,0 C20,20 22,36 12,52 C4,66 22,80 10,100 Z" fill="#37b56a"/></svg></div>

      <div class="bubble b1"></div>
      <div class="bubble b2"></div>
      <div class="bubble b3"></div>
      <div class="bubble b4"></div>

      <!-- 물고기 1 -->
      <div class="fish-wrap fish1">
        <div class="fish-bob">
          <div class="fish-flip">
            <svg viewBox="0 0 64 32" fill="currentColor">
              <path d="M4,16 L-14,4 L-9,16 L-14,28 Z" transform="translate(14,0)"/>
              <path d="M6,16 C6,4 20,-2 38,1 C52,3 62,9 62,16 C62,23 52,29 38,31 C20,34 6,28 6,16 Z"/>
              <circle cx="48" cy="12" r="2.6" fill="#1a1a1a"/>
              <rect x="26" y="2" width="6" height="28" rx="3" fill="#ffffff" opacity="0.8"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- 물고기 2 -->
      <div class="fish-wrap fish2">
        <div class="fish-bob">
          <div class="fish-flip">
            <svg viewBox="0 0 64 32" fill="currentColor">
              <path d="M4,16 L-14,4 L-9,16 L-14,28 Z" transform="translate(14,0)"/>
              <path d="M6,16 C6,4 20,-2 38,1 C52,3 62,9 62,16 C62,23 52,29 38,31 C20,34 6,28 6,16 Z"/>
              <path d="M22,3 C26,-4 34,-4 36,2 C31,3 26,3 22,3 Z" fill="currentColor" opacity="0.9"/>
              <circle cx="48" cy="12" r="2.6" fill="#0d1a22"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- 물고기 3 -->
      <div class="fish-wrap fish3">
        <div class="fish-bob">
          <div class="fish-flip">
            <svg viewBox="0 0 64 32" fill="currentColor">
              <path d="M4,16 L-14,4 L-9,16 L-14,28 Z" transform="translate(14,0)"/>
              <path d="M6,16 C6,4 20,-2 38,1 C52,3 62,9 62,16 C62,23 52,29 38,31 C20,34 6,28 6,16 Z"/>
              <circle cx="48" cy="12" r="2.4" fill="#5a4300"/>
              <rect x="20" y="3" width="4" height="26" rx="2" fill="#ffffff" opacity="0.6"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="sand"></div>
      <div class="glass-shine"></div>
    </div>
  </div>

</body>
</html>
